services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.development
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      WATCHPACK_POLLING: "true"
    env_file:
      - ./frontend/.env.local
    restart: unless-stopped
    networks:
      - wizpx_app

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.development
    volumes:
      - ./backend:/app
    working_dir: /app
    ports:
      - 3001:3001
    env_file:
      - ./backend/.env
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "http://backend:3001" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - wizpx_app

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - 80:80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./backend/images:/images:ro
    depends_on:
      - backend
      - frontend
    networks:
      - wizpx_app

networks:
  wizpx_app: