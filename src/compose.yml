services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.development
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      WATCHPACK_POLLING: "true"
    env_file:
      - path: ./frontend/.env
        required: false
    restart: unless-stopped
    networks:
      - wizpx_app

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.development
    volumes:
      - ./backend:/app
      # Az image-ben telepített betűtípusok (fonts/) a bind mount alatt is megmaradnak
      - /app/fonts
    ports:
      - 3001:3001
    env_file:
      - path: ./backend/.env
        required: false
    restart: unless-stopped
    healthcheck:
      # -f: HTTP hibakódnál (pl. 404, 500) a curl hibával tér vissza, különben a check mindig sikeres lenne
      test: [ "CMD", "curl", "-fsS", "http://localhost:3001/status" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - wizpx_app

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - 80:80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - wizpx_app

networks:
  wizpx_app:
